name: Aurora Android Engine

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'HTTPS ZIP or MediaFire source URL'
        required: true
        type: string
      zip_password:
        description: 'ZIP password (optional)'
        required: false
        type: string
      channel_id:
        description: 'Discord ticket channel ID'
        required: true
        type: string
      user_id:
        description: 'Discord user ID'
        required: true
        type: string
      worker_url:
        description: 'Cloudflare Worker base URL'
        required: true
        type: string
      build_id:
        description: 'Build identifier issued by the Worker'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: aurora-build-${{ inputs.user_id || github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Compile Android source
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
    env:
      SOURCE_URL: ${{ inputs.zip_url }}
      SOURCE_PASSWORD: ${{ inputs.zip_password }}
      GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g'
    steps:
      - name: Checkout trusted engine scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Report build progress
        env:
          WORKER_URL: ${{ inputs.worker_url }}
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
          BUILD_ID: ${{ inputs.build_id }}
          USER_ID: ${{ inputs.user_id }}
          CHANNEL_ID: ${{ inputs.channel_id }}
          PROGRESS_STEP: '0'
          PROGRESS_STAGE: '⚙️ Preparando ambiente'
        run: python3 scripts/progress.py

      - name: Prepare ZIP and detect project root
        env:
          WORKER_URL: ${{ inputs.worker_url }}
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
          BUILD_ID: ${{ inputs.build_id }}
          USER_ID: ${{ inputs.user_id }}
          CHANNEL_ID: ${{ inputs.channel_id }}
          PROGRESS_STEP: '1'
          PROGRESS_STAGE: '💿 Extraindo arquivos do projeto'
        run: |
          python3 scripts/progress.py
          python3 scripts/prepare_project.py

      - name: Detect toolchain
        id: toolchain
        env:
          WORKER_URL: ${{ inputs.worker_url }}
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
          BUILD_ID: ${{ inputs.build_id }}
          USER_ID: ${{ inputs.user_id }}
          CHANNEL_ID: ${{ inputs.channel_id }}
          PROGRESS_STEP: '2'
          PROGRESS_STAGE: '🔍 Detectando configurações e dependências'
        run: |
          python3 scripts/progress.py
          python3 scripts/detect_toolchain.py

      - name: Report Android setup
        env:
          WORKER_URL: ${{ inputs.worker_url }}
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
          BUILD_ID: ${{ inputs.build_id }}
          USER_ID: ${{ inputs.user_id }}
          CHANNEL_ID: ${{ inputs.channel_id }}
          PROGRESS_STEP: '3'
          PROGRESS_STAGE: '📱 Configurando Java e Android SDK'
        run: python3 scripts/progress.py

      - name: Configure detected JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.toolchain.outputs.java_version }}

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Do not request legacy SDK package "tools" (no longer available).
          packages: "platform-tools"

      - name: Install required SDK packages
        env:
          SDK: ${{ steps.toolchain.outputs.compile_sdk }}
          NDK: ${{ steps.toolchain.outputs.ndk_version }}
          CMAKE: ${{ steps.toolchain.outputs.cmake_version }}
        run: |
          set -euo pipefail
          packages=("platform-tools" "platforms;android-${SDK}")
          if [[ -n "$NDK" ]]; then packages+=("ndk;${NDK}"); fi
          if [[ -n "$CMAKE" ]]; then packages+=("cmake;${CMAKE}"); fi
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "${packages[@]}"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Report Gradle preparation
        env:
          WORKER_URL: ${{ inputs.worker_url }}
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
          BUILD_ID: ${{ inputs.build_id }}
          USER_ID: ${{ inputs.user_id }}
          CHANNEL_ID: ${{ inputs.channel_id }}
          PROGRESS_STEP: '4'
          PROGRESS_STAGE: '🔧 Preparando Gradle'
        run: python3 scripts/progress.py

      - name: Build APK with Gradle
        env:
          WORKER_URL: ${{ inputs.worker_url }}
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
          BUILD_ID: ${{ inputs.build_id }}
          USER_ID: ${{ inputs.user_id }}
          CHANNEL_ID: ${{ inputs.channel_id }}
          PROGRESS_STEP: '5'
          PROGRESS_STAGE: '🏗️ Compilando o aplicativo'
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          if [[ -f ./gradlew ]]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          else
            echo 'gradlew missing. Using runner Gradle; compatibility depends on project.'
            gradle --no-daemon --stacktrace assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          fi

      - name: Collect generated APKs
        env:
          WORKER_URL: ${{ inputs.worker_url }}
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
          BUILD_ID: ${{ inputs.build_id }}
          USER_ID: ${{ inputs.user_id }}
          CHANNEL_ID: ${{ inputs.channel_id }}
          PROGRESS_STEP: '6'
          PROGRESS_STAGE: '📦 Localizando o APK'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          mapfile -d '' apks < <(find "$PROJECT_ROOT" -type f -path '*/build/outputs/apk/*' -name '*.apk' -print0)
          if (( ${#apks[@]} == 0 )); then echo 'No APK found'; exit 1; fi
          i=0
          for apk in "${apks[@]}"; do
            i=$((i+1))
            cp "$apk" "output/${i}-$(basename "$apk")"
          done
          ls -lh output

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Aurora-Launcher-APK
          path: output/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish APK to GoFile Guest
        env:
          WORKER_URL: ${{ inputs.worker_url }}
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
          BUILD_ID: ${{ inputs.build_id }}
          USER_ID: ${{ inputs.user_id }}
          CHANNEL_ID: ${{ inputs.channel_id }}
          PROGRESS_STEP: '7'
          PROGRESS_STAGE: '☁️ Enviando APK para GoFile Guest'
        run: python3 scripts/upload_apk.py

      - name: Report finalization
        env:
          WORKER_URL: ${{ inputs.worker_url }}
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
          BUILD_ID: ${{ inputs.build_id }}
          USER_ID: ${{ inputs.user_id }}
          CHANNEL_ID: ${{ inputs.channel_id }}
          PROGRESS_STEP: '8'
          PROGRESS_STAGE: '🎉 Finalizando compilação'
        run: python3 scripts/progress.py

      - name: Save private APK link for notification
        uses: actions/upload-artifact@v4
        with:
          name: Aurora-Private-Link
          path: apk_download_url.txt
          retention-days: 1

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Aurora-Build-Logs
          path: |
            build.log
            workspace/download-debug.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Save concise failure reason
        if: failure()
        shell: bash
        run: |
          echo "Falha de compilação/publicação. Consulte o artefato Aurora-Build-Logs e a etapa com erro nesta execução." > build_failure.txt
      - name: Upload failure reason
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Aurora-Build-Failure
          path: build_failure.txt
          retention-days: 1

  notify:
    name: Notify Worker and release build lock
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
      CHANNEL_ID: ${{ inputs.channel_id }}
      USER_ID: ${{ inputs.user_id }}
      WORKER_URL: ${{ inputs.worker_url }}
      BUILD_RESULT: ${{ needs.build.result }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      ARTIFACT_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts
      BUILD_ID: ${{ inputs.build_id }}
    steps:
      - name: Checkout notification script
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Retrieve private APK link
        if: needs.build.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: Aurora-Private-Link
      - name: Retrieve failure reason
        if: needs.build.result != 'success'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: Aurora-Build-Failure
      - name: Send completion callback
        run: python3 scripts/notify.py
