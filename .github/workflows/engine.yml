name: Aurora Android Engine

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'HTTPS ZIP or MediaFire source URL'
        required: true
        type: string
      zip_password:
        description: 'ZIP password (optional)'
        required: false
        type: string
      channel_id:
        description: 'Discord ticket channel ID'
        required: true
        type: string
      user_id:
        description: 'Discord user ID'
        required: true
        type: string
      worker_url:
        description: 'Cloudflare Worker base URL'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: aurora-build-${{ inputs.user_id || github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Compile Android source
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
    env:
      SOURCE_URL: ${{ inputs.zip_url }}
      SOURCE_PASSWORD: ${{ inputs.zip_password }}
      GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g'
    steps:
      - name: Checkout trusted engine scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare ZIP and detect project root
        run: python3 scripts/prepare_project.py

      - name: Detect toolchain
        run: python3 scripts/detect_toolchain.py

      - name: Configure detected JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Do not request legacy SDK package "tools" (no longer available).
          packages: "platform-tools"

      - name: Install required SDK packages
        env:
          SDK: ${{ env.COMPILE_SDK }}
          NDK: ${{ env.NDK_VERSION }}
          CMAKE: ${{ env.CMAKE_VERSION }}
        run: |
          set -euo pipefail
          packages=("platform-tools" "platforms;android-${SDK}")
          if [[ -n "$NDK" ]]; then packages+=("ndk;${NDK}"); fi
          if [[ -n "$CMAKE" ]]; then packages+=("cmake;${CMAKE}"); fi
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "${packages[@]}"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK with Gradle
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          if [[ -f ./gradlew ]]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          else
            echo 'gradlew missing. Using runner Gradle; compatibility depends on project.'
            gradle --no-daemon --stacktrace assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          fi

      - name: Collect generated APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          mapfile -d '' apks < <(find "$PROJECT_ROOT" -type f -path '*/build/outputs/apk/*' -name '*.apk' -print0)
          if (( ${#apks[@]} == 0 )); then echo 'No APK found'; exit 1; fi
          i=0
          for apk in "${apks[@]}"; do
            i=$((i+1))
            cp "$apk" "output/${i}-$(basename "$apk")"
          done
          ls -lh output

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Aurora-Launcher-APK
          path: output/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Aurora-Build-Logs
          path: |
            build.log
            workspace/download-debug.txt
          if-no-files-found: ignore
          retention-days: 7

  notify:
    name: Notify Worker and release build lock
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
      CHANNEL_ID: ${{ inputs.channel_id }}
      USER_ID: ${{ inputs.user_id }}
      WORKER_URL: ${{ inputs.worker_url }}
      BUILD_RESULT: ${{ needs.build.result }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      ARTIFACT_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts
    steps:
      - name: Checkout notification script
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Send completion callback
        run: python3 scripts/notify.py
